{% extends "auth_base.html" %}
{% block title %}Sign In — MindMap{% endblock %}

{% block auth_content %}
<div class="form-header">
    <h3>Welcome Back</h3>
    <p>Sign in to your MindMap account</p>
</div>

<form method="POST" action="{{ url_for('auth.login') }}">
    <div class="input-group-custom">
        <label for="username">Username or Email</label>
        <div class="input-icon-wrapper">
            <i class="bi bi-person"></i>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username or email" required autofocus>
        </div>
    </div>
    
    <div class="input-group-custom">
        <label for="password">Password</label>
        <div class="input-icon-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label text-muted" for="remember" style="font-size: 0.9rem;">
                Remember me
            </label>
        </div>
        <a href="#" class="text-decoration-none" style="font-size: 0.9rem; font-weight: 500;">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-primary btn-primary-custom w-100 text-white">
        Sign In <i class="bi bi-arrow-right ms-1"></i>
    </button>
</form>

<div class="quote-box mt-4">
    &ldquo; Intelligent automation<br>for a better, smarter you. &rdquo;
</div>
{% endblock %}
